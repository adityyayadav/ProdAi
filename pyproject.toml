readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=0.6.0",
    "langchain>=0.3.0",
    "langchain-chroma>=0.1.4",
    "langchain-community>=0.3.3",
    "langchain-openai>=0.2.8",
    "langgraph>=0.2.41",
    "nest-asyncio>=1.6.0",
    "nicegui>=2.5.0",
    "pandas>=2.2.3",
    "ruff>=0.7.0",
    "sentence-transformers>=3.2.1",
    "torch>=2.5.0",
    "yt-dlp>=2026.10.26",
]
